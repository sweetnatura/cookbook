name: Build and publish cookbook

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch: {}    # "Run workflow" button for an immediate update
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cookbook
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build from Notion
        run: node scripts/build.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          COOKBOOK_PREVIEW: ${{ vars.COOKBOOK_PREVIEW }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Mark new recipes as Publicada
        run: node scripts/mark-published.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
